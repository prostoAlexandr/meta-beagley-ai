#@TYPE: Machine
#@NAME: BeagleY-AI Custom Machine
#@DESCRIPTION: Custom machine configuration for BeagleY-AI board based on TI AM67A SOC

# 1. Наследуем базовые аппаратные настройки BeagleY-AI из мета-слоя TI / BeagleBoard
require conf/machine/beagley-ai.conf

# 2. Переопределяем или переименовываем описание
MACHINE_NAME = "BeagleY-AI Custom Lab Machine"

# 3. Задаем поддерживаемые форматы итогового образа
# tar.xz нужен для распаковки в NFS, wic — для записи на SD-карту
IMAGE_FSTYPES += "tar.xz wic"

# 4. Можем явно зафиксировать предпочтительный провайдер ядра
PREFERRED_PROVIDER_virtual/kernel ?= "linux-bb.org"

# 5. Дополнительные аппаратные флаги машины
MACHINE_FEATURES:append = " usbhost vfat serial"

# 6. Заставим ядро подхватывать правильный девайс три
WKS_FILE = "beagley-lab.wks.in"
IMAGE_EFI_BOOT_FILES:append = " ti/k3-am67a-beagley-ai.dtb;k3-am67a-beagley-ai.dtb"
