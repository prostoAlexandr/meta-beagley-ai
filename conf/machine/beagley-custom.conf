#@TYPE: Machine
#@NAME: BeagleY-AI Custom Machine
#@DESCRIPTION: Custom machine configuration for BeagleY-AI board based on TI AM67A SOC

# Inherit the base BeagleY-AI hardware settings from the TI / BeagleBoard meta layer
require conf/machine/beagley-ai.conf

# Set the supported output image formats
# tar.xz is used for unpacking to NFS, wic for writing to an SD card
IMAGE_FSTYPES += "tar.xz wic"

# Explicitly pin the preferred kernel provider
PREFERRED_PROVIDER_virtual/kernel ?= "linux-bb.org"

# Additional machine hardware features
MACHINE_FEATURES:append = " usbhost vfat serial"

# Boot via U-Boot extlinux instead of GRUB EFI
MACHINE_FEATURES:remove = "efi"

# Boot files for U-Boot extlinux on the FAT boot partition
IMAGE_BOOT_FILES:append = " \
    Image \
    k3-am67a-beagley-ai.dtb;dtb/ti/k3-am67a-beagley-ai.dtb \
    extlinux.conf;extlinux/extlinux.conf \
"
do_image_wic[depends] += "extlinux-conf:do_deploy"
