# 5. TV, radio, SDR; keep cameras. Without MEDIA_SUPPORT_FILTER the *_SUPPORT options are forced on
CONFIG_MEDIA_SUPPORT_FILTER=y
# CONFIG_MEDIA_ANALOG_TV_SUPPORT is not set
# CONFIG_MEDIA_DIGITAL_TV_SUPPORT is not set
# CONFIG_MEDIA_RADIO_SUPPORT is not set
# CONFIG_MEDIA_SDR_SUPPORT is not set

# 6. Network and cluster file systems, NFS server (keep the NFS client); BLK_DEV_RBD selects CEPH_LIB
# CONFIG_CIFS is not set
# CONFIG_SMB_SERVER is not set
# CONFIG_CEPH_FS is not set
# CONFIG_BLK_DEV_RBD is not set
# CONFIG_CEPH_LIB is not set
# CONFIG_NFSD is not set
# CONFIG_GFS2_FS is not set

# 7. Built-in file systems we do not use (rootfs is ext4, boot is vfat)
# CONFIG_BTRFS_FS is not set
# CONFIG_XFS_FS is not set
# CONFIG_F2FS_FS is not set

# 8. Network block replication, RAID and device mapper
# CONFIG_BLK_DEV_DRBD is not set
# CONFIG_MD is not set

# 9. Staging drivers
# CONFIG_STAGING is not set

# 10. ATM networking, Hyper-V guest
# CONFIG_ATM is not set
# CONFIG_HYPERV is not set

# 11. ACPI (we use Device Tree)
# CONFIG_ACPI is not set

# 12. Built-in drivers of other SoCs
# CONFIG_HISI_PMU is not set
# CONFIG_ARM_CCI_PMU is not set
# CONFIG_MFD_MAX77620 is not set
# CONFIG_MMC_SDHCI_OF_ARASAN is not set

# 13. Raw NAND/NOR flash and its file systems (no flash on the board); also drops UBIFS_FS, JFFS2_FS
# CONFIG_MTD is not set

# 14. SATA, UFS storage, persistent memory, SCSI/iSCSI target
# CONFIG_ATA is not set
# CONFIG_SCSI_UFSHCD is not set
# CONFIG_LIBNVDIMM is not set
# CONFIG_TARGET_CORE is not set

# 15. Telecom and cluster protocols, AFS, cluster lock manager, mesh, virtual switch, load balancer
# CONFIG_IP_SCTP is not set
# CONFIG_TIPC is not set
# CONFIG_AF_RXRPC is not set
# CONFIG_AFS_FS is not set
# CONFIG_DLM is not set
# CONFIG_BATMAN_ADV is not set
# CONFIG_OPENVSWITCH is not set
# CONFIG_IP_VS is not set

# 16. 802.15.4 (Zigbee/6LoWPAN) and NFC radios
# CONFIG_IEEE802154 is not set
# CONFIG_MAC802154 is not set
# CONFIG_NFC is not set

# 17. Old pre-UVC USB webcams and USB video grabbers (UVC is kept)
# CONFIG_USB_GSPCA is not set
# CONFIG_USB_PWC is not set
# CONFIG_USB_S2255 is not set
# CONFIG_VIDEO_USBTV is not set
# CONFIG_VIDEO_EM28XX is not set

# 18. Server power supply monitoring
# CONFIG_PMBUS is not set

# 19. VMware NIC, virtio 9p, virtual GEM, eCryptfs, fscache backend
# CONFIG_VMXNET3 is not set
# CONFIG_NET_9P is not set
# CONFIG_9P_FS is not set
# CONFIG_DRM_VGEM is not set
# CONFIG_ECRYPT_FS is not set
# CONFIG_CACHEFILES is not set
