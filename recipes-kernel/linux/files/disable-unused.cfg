# Drivers and features the BeagleY-AI does not need (lab 11)

# 1. Kernel headers module (eBPF/bcc only)
# CONFIG_IKHEADERS is not set

# 2. AMD GPUs
# CONFIG_DRM_AMDGPU is not set

# 3. Wi-Fi of other vendors (CC33xx is WLAN_VENDOR_TI)
